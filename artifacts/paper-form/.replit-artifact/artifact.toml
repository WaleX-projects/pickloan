kind = "mobile"
previewPath = "/"
title = "Paper Form Scanner"
description = "An offline-first mobile app for loan officers to scan handwritten paper forms, keep them safe on the device, review extracted information, and confirm verified applications."
version = "1.0.0"
id = "artifacts/paper-form"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 24976

[services.development]
run = "pnpm --filter @workspace/paper-form run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/paper-form", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/paper-form", "run", "serve" ]

[services.env]
PORT = "24976"
BASE_PATH = "/"
